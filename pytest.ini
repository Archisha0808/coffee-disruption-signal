# Where the tests are, and where they are not.
#
# Without `testpaths`, pytest walks the whole repository from the root and
# collects anything named test_*.py. That is fine until a copy of the project
# exists inside it - a folder of files staged to be applied, an unpacked
# archive, a second checkout - and then every test file is collected twice.
# Two files with the same basename cannot both be imported as a top-level
# module, so pytest stops with "import file mismatch" on all of them and no
# test runs at all. The failure looks like a broken repository and is only a
# directory being read twice.
#
# `testpaths` fixes it properly: a bare `pytest` collects only tests/, whatever
# else is lying about. `norecursedirs` is the belt to that braces, for the case
# where a path is passed explicitly.
[pytest]
testpaths = tests
norecursedirs = _merge .git .venv venv build dist *.egg-info __pycache__ node_modules
